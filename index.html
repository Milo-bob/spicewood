<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spicewood</title>
<style>
html,body{margin:0;height:100%;background:#0d0906;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#000}
#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#joy{position:absolute;left:0;bottom:0;width:44%;height:72%;pointer-events:auto}
#joyBase{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:rgba(26,17,10,.5);border:3px solid #8a6a3a;box-shadow:inset 0 0 0 2px rgba(26,17,10,.7),inset 0 0 0 3px #3a2814;display:none;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffe9a0,#c8903a);border:2px solid #ffd040;box-shadow:0 2px 0 #000;opacity:.8;transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border-radius:7px;background:linear-gradient(#34241a,#1a110a);border:2px solid #8a6a3a;box-shadow:inset 0 0 0 2px #1a110a,inset 0 0 0 3px #3a2814,0 3px 0 #000;color:#ffe9a0;font:bold 2.4vmin "Segoe UI",Tahoma,Verdana,Arial,sans-serif;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;aspect-ratio:1;text-shadow:1px 1px 0 #000}
.tb:active{background:linear-gradient(#6a4a26,#3a2814);border-color:#ffd040;transform:translateY(2px);box-shadow:inset 0 0 0 2px #1a110a,inset 0 0 0 3px #5a4220,0 1px 0 #000}
#bJ{right:3%;bottom:6%;width:13%;font-size:3vmin}
#bK{right:18%;bottom:4%;width:9.5%}
#bL{right:17%;bottom:24%;width:9.5%}
#bR{right:3%;bottom:33%;width:9%}
#bE{right:30%;bottom:5%;width:9%;font-size:2vmin}
#bI{right:22%;top:3%;width:6.2%;font-size:1.7vmin}
#bQ{right:29%;top:3%;width:6.2%;font-size:1.7vmin}
#bS{right:29%;top:13%;width:6.2%;font-size:1.7vmin}
#bP{right:36%;top:3%;width:6.2%;font-size:1.7vmin}
.tb small{display:block;font-size:.55em;font-weight:normal;line-height:1}
.tb{flex-direction:column;text-align:center}
.tb.off{display:none}
.tb.hot{background:linear-gradient(#7a5a1c,#3a2814);border-color:#ffd040;color:#fff;box-shadow:inset 0 0 0 2px #1a110a,inset 0 0 0 3px #8a6a3a,0 0 10px rgba(255,208,64,.6),0 3px 0 #000}
#bJ{background:linear-gradient(#5a2a1a,#2a110a);border-color:#c8803a}
#bR{background:linear-gradient(#2a3a2a,#101a10)}
.tb.dim{opacity:.45}
#rotate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#0d0906;color:#ffe9a0;font:bold 5vmin monospace;text-align:center;padding:8%}
@media (pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate">Please turn your phone sideways to play Spicewood.</div>
<div id="stage">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="touch">
    <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div class="tb" id="bJ" data-k="attack">ATK</div>
    <div class="tb" id="bK" data-k="skill1">A</div>
    <div class="tb" id="bL" data-k="skill2">B</div>
    <div class="tb" id="bR" data-k="roll">SHIELD</div>
    <div class="tb" id="bE" data-k="interact">USE</div>
    <div class="tb" id="bI" data-k="inv">BAG</div>
    <div class="tb" id="bQ" data-k="potion">POT</div>
    <div class="tb off" id="bS" data-k="scroll">HOME</div>
    <div class="tb" id="bP" data-k="pause">II</div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/skills.js"></script>
<script src="js/items.js"></script>
<script src="js/base.js"></script>
<script src="js/sprites.js"></script>
<script src="js/maps.js"></script>
<script src="js/fields.js"></script>
<script src="js/spots.js"></script>
<script src="js/landmarks.js"></script>
<script src="js/zones.js"></script>
<script src="js/world.js"></script>
<script src="js/dungeons.js"></script>
<script src="js/progress.js"></script>
<script src="js/inventory.js"></script>
<script src="js/tools.js"></script>
<script src="js/terraintools.js"></script>
<script src="js/forgotten.js"></script>
<script src="js/shop.js"></script>
<script src="js/houses.js"></script>
<script src="js/hearth.js"></script>
<script src="js/getitem.js"></script>
<script src="js/dunmap.js"></script>
<script src="js/hud.js"></script>
<script src="js/fx.js"></script>
<script src="js/story.js"></script>
<script src="js/quests.js"></script>
<script src="js/scenes.js"></script>
<script src="js/visions.js"></script>
<script src="js/reveals.js"></script>
<script src="js/climax.js"></script>
<script src="js/account.js"></script>
<script src="js/game.js"></script>
</body>
</html>
