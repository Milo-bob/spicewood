<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spicewood</title>
<style>
html,body{margin:0;height:100%;background:#0d0906;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;background:#000}
#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
#touch.on{display:block}
#joy{position:absolute;left:0;bottom:0;width:44%;height:72%;pointer-events:auto}
#joyBase{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);display:none;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);color:#fff;font:bold 2.4vmin monospace;display:flex;align-items:center;justify-content:center;aspect-ratio:1;text-shadow:0 1px 2px #000}
.tb:active{background:rgba(255,255,255,.4)}
#bJ{right:3%;bottom:6%;width:13%;font-size:3vmin}
#bK{right:18%;bottom:4%;width:9.5%}
#bL{right:17%;bottom:24%;width:9.5%}
#bR{right:3%;bottom:33%;width:9%}
#bU{right:30%;bottom:25%;width:8.5%}
#bE{right:30%;bottom:6%;width:7.5%;font-size:2vmin}
#bI{right:1%;top:3%;width:6.2%;font-size:1.7vmin}
#bQ{right:8%;top:3%;width:6.2%;font-size:1.7vmin}
#bP{right:15%;top:3%;width:6.2%;font-size:1.7vmin}
#bT{right:22%;top:3%;width:6.2%;font-size:1.7vmin}
#bM{right:29.5%;top:3%;width:6.2%;font-size:1.7vmin}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="touch">
    <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div class="tb" id="bJ" data-k="attack">ATK</div>
    <div class="tb" id="bK" data-k="skill1">S1</div>
    <div class="tb" id="bL" data-k="skill2">S2</div>
    <div class="tb" id="bU" data-k="skill3">S3</div>
    <div class="tb" id="bR" data-k="roll">ROLL</div>
    <div class="tb" id="bE" data-k="interact">USE</div>
    <div class="tb" id="bI" data-k="inv">BAG</div>
    <div class="tb" id="bQ" data-k="potion">POT</div>
    <div class="tb" id="bP" data-k="pause">II</div>
    <div class="tb" id="bT" data-k="tree">SKL</div>
    <div class="tb" id="bM" data-k="map">MAP</div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/skills.js"></script>
<script src="js/items.js"></script>
<script src="js/base.js"></script>
<script src="js/sprites.js"></script>
<script src="js/maps.js"></script>
<script src="js/zones.js"></script>
<script src="js/world.js"></script>
<script src="js/dungeons.js"></script>
<script src="js/inventory.js"></script>
<script src="js/skillui.js"></script>
<script src="js/hud.js"></script>
<script src="js/fx.js"></script>
<script src="js/story.js"></script>
<script src="js/quests.js"></script>
<script src="js/account.js"></script>
<script src="js/game.js"></script>
</body>
</html>
